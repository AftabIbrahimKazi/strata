<!DOCTYPE html>
<html lang="en" data-st-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopMap — Basic Example</title>

  <!-- MapLibre GL JS (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <!-- PMTiles protocol -->
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <!-- ShopMap UMD build -->
  <script src="../dist/shopmap.umd.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --map-marker: #7c3aed;
      font-family: system-ui, sans-serif;
    }

    body {
      background: #f9f9f9;
      color: #222;
      padding: 2rem;
    }

    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p  { color: #666; margin-bottom: 1.5rem; }

    #map {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    button {
      padding: 0.5rem 1rem;
      border: 1.5px solid #7c3aed;
      border-radius: 6px;
      background: transparent;
      color: #7c3aed;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease;
    }

    button:hover {
      background: #7c3aed;
      color: #fff;
    }

    button[data-st-active="true"] {
      background: #7c3aed;
      color: #fff;
    }

    button[data-st-active="false"] {
      background: transparent;
      color: #7c3aed;
    }
  </style>
</head>
<body>

  <h1>ShopMap — Basic Example</h1>
  <p>A themed map component using <code>--map-marker: #7c3aed</code>. No API key needed.</p>

  <div id="map"></div>

  <div class="controls">
    <button id="btn-light"   data-st-active="true">Light theme</button>
    <button id="btn-dark"    data-st-active="false">Dark theme</button>
    <button id="btn-sepia"   data-st-active="false">Sepia theme</button>
    <button id="btn-2d"      data-st-active="true">2D</button>
    <button id="btn-3d"      data-st-active="false">3D</button>
  </div>

  <script>
    const map = new ShopMap.ShopMap('#map', {
      location: { lat: 51.5074, lng: -0.1278 },  // London
      tiles: 'https://tiles.openfreemap.org/planet/{z}/{x}/{y}.pbf',
      mode: '2d',
      theme: 'light',
      pin: {
        size: 'md',
        icon: 'store',
        pulse: true,
        label: 'Our Shop',
      },
      popup: {
        tokens: {
          name: 'Acme London',
          address: '1 Oxford Street, London W1D 1BS',
          hours: 'Mon–Sat 9am–8pm, Sun 11am–6pm',
          directions: 'https://maps.google.com/?q=51.5074,-0.1278',
        },
      },
    })

    // Theme controls
    const themeButtons = {
      light: document.getElementById('btn-light'),
      dark:  document.getElementById('btn-dark'),
      sepia: document.getElementById('btn-sepia'),
    }

    function setTheme(name) {
      map.setTheme(name)
      document.documentElement.setAttribute('data-st-theme', name === 'sepia' ? 'light' : name)
      for (const [key, btn] of Object.entries(themeButtons)) {
        btn.setAttribute('data-st-active', key === name ? 'true' : 'false')
      }
    }

    themeButtons.light.addEventListener('click', () => setTheme('light'))
    themeButtons.dark.addEventListener('click',  () => setTheme('dark'))
    themeButtons.sepia.addEventListener('click', () => setTheme('sepia'))

    // Mode controls
    const modeButtons = {
      '2d': document.getElementById('btn-2d'),
      '3d': document.getElementById('btn-3d'),
    }

    function setMode(mode) {
      map.setMode(mode)
      for (const [key, btn] of Object.entries(modeButtons)) {
        btn.setAttribute('data-st-active', key === mode ? 'true' : 'false')
      }
    }

    document.getElementById('btn-2d').addEventListener('click', () => setMode('2d'))
    document.getElementById('btn-3d').addEventListener('click', () => setMode('3d'))
  </script>

</body>
</html>
